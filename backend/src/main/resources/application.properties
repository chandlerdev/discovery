# ---- MySQL ----
# Defaults are for LOCAL dev (root / empty password). On the server, set the env vars
# DB_URL / DB_USERNAME / DB_PASSWORD (e.g. DB_USERNAME=<user> DB_PASSWORD=<password>)
# and these defaults are ignored — so the same build runs locally and live with no edits.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freshbyte_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8095
server.error.include-message=always

# ---- Portal settings ----
# Team members sign in with real credentials from the admin_user table; there is no
# longer a shared passcode. Seed account: priya / desss2026 (see DataInitializer).

# AES-256 key (base64, 32 bytes) for CLIENT questionnaire passwords, which the team can
# reveal with the eye button — that requires reversible encryption, not hashing.
# Anyone with the database AND this key can read every client password, so:
#   - override it in production via the PORTAL_ENCRYPTION_KEY env var
#   - never commit the real key
#   - changing it makes existing stored passwords undecryptable
# Team logins (admin_user) are BCrypt-hashed and are NOT affected by this key.
portal.encryption-key=${PORTAL_ENCRYPTION_KEY:Zm9yLWRldi1vbmx5LWNoYW5nZS1tZS0zMi1ieXRlISE=}

# Comma-separated. frontend (public questionnaire) = :3000, admin (team portal) = :3001
portal.cors-origins=http://localhost:3000,http://localhost:3001,http://discovery.desss-portfolio.com/,http://localhost:3008,http://localhost:3009,https://discovery.desss-portfolio.com/

# ---- Logging ----
logging.level.com.desss.portal=DEBUG
